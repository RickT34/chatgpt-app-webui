# Include inside nginx's http {} context (e.g. /etc/nginx/conf.d/chatgpt-webui.conf).
# Replace chatgpt.example.com and certificate paths. Start the App with:
# CHATGPT_WEB_ORIGIN=https://chatgpt.example.com scripts/start --ozone-platform=headless --disable-gpu
# Requires nginx >= 1.25.1 with ngx_http_v2_module.
upstream chatgpt_webui_backend {
    server 127.0.0.1:18765;
    keepalive 16;
}
map $http_upgrade $chatgpt_webui_connection {
    default upgrade;
    ''      '';
}
server {
    listen 80;
    access_log off;
    server_name chatgpt.example.com;
    return 308 https://chatgpt.example.com$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name chatgpt.example.com;
    ssl_certificate     /etc/letsencrypt/live/chatgpt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatgpt.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Login URLs contain a token. Disable access logging for this private UI.
    access_log off;
    client_max_body_size 32m;
    location / {
        proxy_pass http://chatgpt_webui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chatgpt_webui_connection;
        proxy_buffering off;
        # Seconds, not milliseconds. No URL, cookie or credentials are logged.
        add_header X-WebUI-Upstream-Connect-Time $upstream_connect_time always;
        add_header X-WebUI-Upstream-Header-Time $upstream_header_time always;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
